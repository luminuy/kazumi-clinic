name: Deploy

# Continuous deployment to Cloudflare Workers. Runs ONLY after the CI workflow
# concludes successfully on main, so lint/typecheck/test/build always gate a deploy
# (the automated version of the manual "wait for CI SUCCESS before deploy" rule in
# CLAUDE.md §0). Deploys the exact commit that passed CI, not whatever HEAD is now.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Never deploy two commits at once, and never cancel a deploy already in flight —
# killing `wrangler deploy` or a `d1 execute` mid-run can leave prod half-updated.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # Only when CI actually passed. A failed/cancelled CI run still fires workflow_run.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit CI verified — workflow_run's own SHA is main's tip, which may
          # have moved on. Deploy what was actually green.
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # opennextjs build -> tag-cache migration -> member migration -> wrangler deploy.
      # wrangler authenticates via the two env vars below; no account_id in wrangler.jsonc.
      # Ubuntu runs workerd fine, so the OPEN_NEXT_DEPLOY trick in cf:deploy (added for the
      # old-macOS dev box) is a harmless no-op here.
      - name: Deploy to Cloudflare Workers
        run: pnpm cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # GA4 has to be a BUILD-time value, not a `wrangler.jsonc` var: most public pages are
          # prerendered, so the layout reads process.env during `opennextjs-cloudflare build` and
          # the tag is baked into the static HTML. A runtime-only var would give GA on the dynamic
          # routes and nothing on the prerendered ones — verified 2026-08-04.
          # Set it as a repository *variable* (Settings → Secrets and variables → Actions →
          # Variables), not a secret: a measurement ID is public by design. Unset = no GA at all.
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}

      # This catches runtime-only failures that pass under Node but fail under workerd within a
      # minute of deployment. The Worker is already live, so a red result is an alert, not rollback.
      - name: Smoke test deployed Worker write paths
        run: |
          set +e
          pnpm smoke
          smoke_status=$?
          set -e

          case "$smoke_status" in
            0)
              exit 0
              ;;
            2)
              # Registration allows 5 requests/15 min/IP and login 10 requests/5 min/IP.
              # A 429 proves the Worker, routing, and D1 limiter respond, but cannot test crypto.
              echo "::warning title=Smoke test inconclusive::Rate limited by an account endpoint; production health was not disproved."
              exit 0
              ;;
            *)
              exit 1
              ;;
          esac
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
